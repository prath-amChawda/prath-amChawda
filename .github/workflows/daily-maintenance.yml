name: Daily Repository Maintenance

on:
  schedule:
    # Runs daily at 00:17 UTC
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance-heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update maintenance log
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          cat > activity/daily-maintenance.md <<EOF
          # Automated Repository Maintenance

          This file is updated by a scheduled GitHub Actions workflow to confirm that the repository maintenance job ran successfully.

          - Last automated update: `$TODAY`
          - Type: automated maintenance heartbeat (not a record of manual coding work)
          EOF

      - name: Commit daily maintenance record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pratham Chawda"
          git config user.email "177559191+prath-amChawda@users.noreply.github.com"
          git add activity/daily-maintenance.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily repository maintenance"
          git push
